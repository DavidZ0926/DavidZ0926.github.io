  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script>
    /* 在首帧前定下主题，避免闪烁：记住的选择 > 系统设置 */
    (function () {
      var d = document.documentElement, t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.dataset.theme = t;
      d.classList.add('js');
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/main.js" defer></script>
</head>
<body>
  <!-- 壁纸：玻璃要"透"出东西，背后必须有颜色 -->
  <div class="wallpaper" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
    <!-- 心电图：canvas 实时绘制随机心跳；SVG 是减少动态效果 / 无 JS 时的静态版本 -->
    <div class="ecg">
      <canvas class="ecg-live"></canvas>
      <svg width="3000" height="120">
        <defs>
          <pattern id="beat" x="150" width="300" height="120" patternUnits="userSpaceOnUse">
            <path d="M0 60H116q8-9 16 0H140l4 5 6-45 6 56 5-16H182q14-15 28 0H300"/>
          </pattern>
        </defs>
        <rect width="3000" height="120" fill="url(#beat)"/>
      </svg>
    </div>
  </div>

  <!-- Liquid Glass 折射滤镜由 main.js 按元素尺寸生成（仅 Chromium） -->
  <svg class="lens-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs id="lens-defs"></defs></svg>

  <!-- 滚过大标题后浮现的紧凑导航，对应 iOS 的大标题折叠 -->
  <header class="topbar glass" data-glass data-lens>
    <a class="topbar-title" href="#top">张林晖</a>
    <nav class="topbar-nav" aria-label="页面导航">
      <a href="#friends">友链</a>
      <a href="mailto:z173213618@gmail.com">联系</a>
    </nav>
  </header>

  <button class="theme-toggle glass" data-glass data-lens type="button" aria-label="切换到深色模式" title="切换到深色模式">
    <span class="swap" aria-hidden="true">
      <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8Z"/></svg>
    </span>
  </button>

  <main id="top">

        </picture>
        <h1 id="name" class="name rise" style="--i:1">张林晖</h1>
        <p class="affiliation rise" style="--i:2">温州医科大学<span class="sep" aria-hidden="true">·</span>临床医学</p>

        <!-- 当前状态：字形镂空，透出下面流动的彩色 -->

            <svg class="icon status-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>
            当前状态

        <div class="actions rise" style="--i:4">

            <span class="swap" aria-hidden="true">

            <svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 0 0-3 18.52c.47.09.65-.2.65-.46v-1.6c-2.64.57-3.2-1.27-3.2-1.27-.43-1.1-1.05-1.39-1.05-1.39-.86-.59.07-.58.07-.58.95.07 1.45.98 1.45.98.85 1.45 2.22 1.03 2.76.79.09-.61.33-1.03.6-1.27-2.1-.24-4.32-1.05-4.32-4.69 0-1.04.37-1.88.98-2.55-.1-.24-.42-1.2.09-2.51 0 0 .8-.26 2.61.97a9.1 9.1 0 0 1 4.76 0c1.81-1.23 2.61-.97 2.61-.97.51 1.31.19 2.27.09 2.51.61.67.98 1.51.98 2.55 0 3.65-2.22 4.45-4.34 4.68.34.3.65.88.65 1.78v2.64c0 .26.17.56.66.46A9.5 9.5 0 0 0 12 2.5Z"/></svg>
